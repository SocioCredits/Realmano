<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TempMail Pro - Sin Fallos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#111827',
                        bordercolor: '#1f2937'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex flex-col justify-between font-sans selection:bg-cyan-500 selection:text-white">

    <!-- Header -->
    <header class="border-b border-bordercolor bg-cardbg/80 backdrop-blur sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider flex items-center gap-2">
                <span class="inline-block w-3 h-3 rounded-full bg-cyan-500 animate-pulse"></span>
                ULTRA<span class="text-cyan-400">MAIL</span>
            </h1>
            <div id="status-badge" class="text-xs px-2.5 py-1 rounded-full bg-cyan-950 text-cyan-400 border border-cyan-800">
                Sistema Activo
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-8 w-full flex-grow flex flex-col gap-6">

        <!-- Email Generator Box -->
        <section class="bg-cardbg border border-bordercolor rounded-2xl p-6 shadow-2xl flex flex-col gap-4">
            <div class="flex justify-between items-center">
                <label class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Dirección Temporal Asignada</label>
                <button onclick="generateNewEmail()" class="text-xs text-cyan-400 hover:underline cursor-pointer">Cambiar correo</button>
            </div>
            <div class="flex flex-col sm:flex-row gap-3">
                <div id="email-display" class="flex-grow bg-darkbg border border-bordercolor rounded-xl px-4 py-3 text-cyan-400 font-mono text-sm sm:text-base select-all flex items-center overflow-x-auto">
                    Cargando buzón...
                </div>
                <button onclick="copyEmail()" id="copy-btn" class="bg-cyan-600 hover:bg-cyan-500 active:scale-95 transition-all text-white font-medium px-6 py-3 rounded-xl flex items-center justify-center gap-2 shrink-0 cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <span>Copiar</span>
                </button>
            </div>
            <div class="flex justify-between items-center text-xs text-slate-400">
                <span id="auto-refresh-status">Verificando mensajes cada 8s...</span>
                <button onclick="checkInbox()" class="hover:text-cyan-400 underline cursor-pointer">Actualizar manual</button>
            </div>
        </section>

        <!-- Inbox Section -->
        <section class="bg-cardbg border border-bordercolor rounded-2xl p-6 shadow-2xl flex flex-col gap-4 flex-grow">
            <div class="flex justify-between items-center border-b border-bordercolor pb-3">
                <h2 class="text-lg font-semibold flex items-center gap-2">
                    Bandeja de Entrada
                    <span id="msg-count" class="text-xs bg-slate-800 text-slate-300 px-2 py-0.5 rounded-full">0</span>
                </h2>
            </div>

            <!-- Messages List & Detail Container -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 flex-grow min-h-[300px]">
                <!-- Messages List -->
                <div id="messages-list" class="md:col-span-1 border border-bordercolor rounded-xl bg-darkbg/50 overflow-y-auto max-h-[450px] divide-y divide-bordercolor">
                    <div class="p-8 text-center text-slate-500 text-sm flex flex-col items-center justify-center h-full">
                        <svg class="w-8 h-8 mb-2 opacity-40 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                        Buscando buzón...
                    </div>
                </div>

                <!-- Message Detail View -->
                <div id="message-detail" class="md:col-span-2 border border-bordercolor rounded-xl bg-darkbg/50 p-6 flex flex-col justify-start overflow-y-auto max-h-[450px]">
                    <div class="text-center text-slate-500 my-auto text-sm">
                        Selecciona un mensaje para ver su contenido.
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-500 border-t border-bordercolor mt-auto">
        Motor Directo 1secmail • Optimizado para GitHub Pages
    </footer>

    <!-- Script de Control Directo -->
    <script>
        const API_URL = 'https://www.1secmail.com/api/v1/';
        let currentEmail = '';
        let currentLogin = '';
        let currentDomain = '';

        const domains = [
            '1secmail.com',
            '1secmail.org',
            '1secmail.net',
            'wwjmp.com',
            'esiix.com',
            'xojxe.com'
        ];

        function generateNewEmail() {
            const randomUser = Math.random().toString(36).substring(2, 12);
            const randomDomain = domains[Math.floor(Math.random() * domains.length)];
            
            currentLogin = randomUser;
            currentDomain = randomDomain;
            currentEmail = `${randomUser}@${randomDomain}`;

            document.getElementById('email-display').textContent = currentEmail;
            document.getElementById('messages-list').innerHTML = `
                <div class="p-8 text-center text-slate-500 text-sm flex flex-col items-center justify-center h-full">
                    <svg class="w-8 h-8 mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    Esperando correos...
                </div>
            `;
            document.getElementById('message-detail').innerHTML = '<div class="text-center text-slate-500 my-auto text-sm">Selecciona un mensaje para ver su contenido.</div>';
            document.getElementById('msg-count').textContent = '0';
            
            checkInbox();
        }

        async function checkInbox() {
            if (!currentLogin || !currentDomain) return;

            try {
                const res = await fetch(`${API_URL}?action=getMessages&login=${currentLogin}&domain=${currentDomain}`);
                if (!res.ok) throw new Error('Error de conexión');
                const messages = await res.json();
                
                renderMessagesList(messages);
            } catch (err) {
                console.error('Error al actualizar bandeja:', err);
            }
        }

        function renderMessagesList(messages) {
            const listEl = document.getElementById('messages-list');
            const countEl = document.getElementById('msg-count');
            
            countEl.textContent = messages.length;

            if (!messages || messages.length === 0) {
                return;
            }

            listEl.innerHTML = '';
            messages.forEach(msg => {
                const item = document.createElement('div');
                item.className = 'p-3 hover:bg-slate-800/60 transition-colors cursor-pointer flex flex-col gap-1 border-b border-bordercolor last:border-none';
                item.onclick = () => fetchMessageContent(msg.id, item);

                item.innerHTML = `
                    <div class="flex justify-between items-center text-xs">
                        <span class="font-semibold text-cyan-300 truncate max-w-[150px]">${escapeHtml(msg.from)}</span>
                        <span class="text-slate-500">${escapeHtml(msg.date)}</span>
                    </div>
                    <div class="text-sm font-medium text-slate-100 truncate">${escapeHtml(msg.subject || '(Sin Asunto)')}</div>
                `;
                listEl.appendChild(item);
            });
        }

        async function fetchMessageContent(id, element) {
            document.querySelectorAll('#messages-list > div').forEach(el => el.classList.remove('bg-slate-800'));
            if (element) element.classList.add('bg-slate-800');

            const detailEl = document.getElementById('message-detail');
            detailEl.innerHTML = '<div class="text-center text-slate-500 my-auto text-sm animate-pulse">Cargando contenido...</div>';

            try {
                const res = await fetch(`${API_URL}?action=readMessage&login=${currentLogin}&domain=${currentDomain}&id=${id}`);
                if (!res.ok) throw new Error('No se pudo cargar el mensaje');
                const msg = await res.json();

                detailEl.innerHTML = `
                    <div class="flex flex-col gap-4">
                        <div class="border-b border-bordercolor pb-3">
                            <h3 class="text-base font-bold text-slate-100 mb-1">${escapeHtml(msg.subject || '(Sin Asunto)')}</h3>
                            <div class="text-xs text-slate-400 flex flex-col sm:flex-row sm:justify-between gap-1">
                                <span><strong>De:</strong> ${escapeHtml(msg.from)}</span>
                                <span>${escapeHtml(msg.date)}</span>
                            </div>
                        </div>
                        <div class="text-sm text-slate-200 bg-darkbg p-4 rounded-xl border border-bordercolor overflow-x-auto">
                            ${msg.htmlBody ? msg.htmlBody : `<pre class="whitespace-pre-wrap font-sans">${escapeHtml(msg.textBody || 'Sin contenido de texto.')}</pre>`}
                        </div>
                    </div>
                `;
            } catch (err) {
                detailEl.innerHTML = `<div class="text-center text-red-400 my-auto text-sm">Error al obtener el detalle del mensaje.</div>`;
            }
        }

        function copyEmail() {
            if (!currentEmail) return;
            navigator.clipboard.writeText(currentEmail);
            const btn = document.getElementById('copy-btn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                <span>¡Copiado!</span>
            `;
            btn.classList.remove('bg-cyan-600', 'hover:bg-cyan-500');
            btn.classList.add('bg-cyan-700');
            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-cyan-700');
                btn.classList.add('bg-cyan-600', 'hover:bg-cyan-500');
            }, 2000);
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // Inicialización y bucle de consulta cada 8 segundos
        window.onload = () => {
            generateNewEmail();
            setInterval(checkInbox, 8000);
        };
    </script>
</body>
    </html>
